[project]
name = "pxr-reduce"
version = "0.2.0"
description = "Tools for reducing polarized X-ray reflectivity data from the RSoXS beamline at the ALS."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "astropy>=7.2.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "scipy>=1.17.1",
    "tqdm>=4.67.3",
    "typer>=0.12.0",
    "uncertainties>=3.2",
]

[project.scripts]
pxr-reduce = "pxr_reduce.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.15.5",
]
test = [
    "pytest>=8.3.0",
]
notebook = [
    "ipykernel>=6.29.0",
    "ipywidgets>=8.1.0",
    "plotly>=5.24.0",
    "anywidget>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Install dev, test, and notebook tooling by default with `uv sync`.
default-groups = ["dev", "test", "notebook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Beamline FITS keywords exceed 8 chars; astropy stores them as HIERARCH cards.
    "ignore:Keyword name.*HIERARCH:astropy.io.fits.verify.VerifyWarning",
]
